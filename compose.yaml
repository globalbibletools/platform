services:
  server:
    build:
      context: .
      target: dev
      dockerfile: Dockerfile.server
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:asdfasdf@db:5432/postgres
      TEST_DATABASE_URL: postgresql://postgres:asdfasdf@test_db:5432/postgres
      JOB_FUNCTION_URL: http://job_worker_light:3000
      JOB_HEAVY_FUNCTION_URL: http://job_worker_heavy:3000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL_S3: http://ministack:4566
      AWS_S3_FORCE_PATH_STYLE: "true"
    volumes:
      - ./:/app
      - platform-node-modules:/app/node_modules
    ports:
      - ${SERVER_PORT:-3000}:3000
    depends_on:
      db:
        condition: service_healthy
      ministack:
        condition: service_healthy
  job_worker_light:
    build:
      context: .
      target: dev
      dockerfile: Dockerfile.job-worker-light
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:asdfasdf@db:5432/postgres
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL_S3: http://ministack:4566
      AWS_S3_FORCE_PATH_STYLE: "true"
      EXPORT_PUBLIC_S3_ENDPOINT: http://localhost:${LOCALSTACK_PORT:-4566}
      BIBLE_SYSTEMS_API_KEY: ${BIBLE_SYSTEMS_API_KEY}
      JOB_QUEUE_NAME: light
    volumes:
      - ./:/app
      - job-worker-light-node-modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
      ministack:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
  job_worker_heavy:
    build:
      context: .
      target: dev
      dockerfile: Dockerfile.job-worker-light
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:asdfasdf@db:5432/postgres
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL_S3: http://ministack:4566
      AWS_S3_FORCE_PATH_STYLE: "true"
      EXPORT_PUBLIC_S3_ENDPOINT: http://localhost:${LOCALSTACK_PORT:-4566}
      BIBLE_SYSTEMS_API_KEY: ${BIBLE_SYSTEMS_API_KEY}
      JOB_QUEUE_NAME: heavy
    volumes:
      - ./:/app
      - job-worker-heavy-node-modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
      ministack:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
  ministack:
    image: ministackorg/ministack:1.5.35
    environment:
      - SERVICES=s3
      - MINISTACK_REGION=us-east-1
      - LOG_LEVEL=WARNING
    ports:
      - ${LOCALSTACK_PORT:-4566}:4566
    volumes:
      - ./ministack/init:/docker-entrypoint-initaws.d
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'awslocal s3api head-bucket --bucket "$${STATIC_ASSET_BUCKET:-gbt-static-assets}" >/dev/null 2>&1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
  db:
    build:
      dockerfile: db/Dockerfile
    restart: always
    shm_size: 128mb
    user: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/scripts/docker-initdb.sh:/docker-entrypoint-initdb.d/docker-initdb.sh
      - ./db:/db
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=asdfasdf
    ports:
      - ${DB_PORT:-6432}:5432
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
  test_db:
    image: postgres:14
    restart: always
    shm_size: 128mb
    user: postgres
    volumes:
      - ./db:/db
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=asdfasdf
    expose:
      - 5432
    ports:
      - ${TEST_DB_PORT:-6433}:5432
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
  docs:
    build:
      context: .
      dockerfile: docs/Dockerfile
    restart: always
    volumes:
      - ./:/app
      - docs-node-modules:/app/docs/node_modules
    ports:
      - ${DOCS_PORT:-4000}:3000
volumes:
  db-data:
  platform-node-modules:
  job-worker-light-node-modules:
  job-worker-heavy-node-modules:
  docs-node-modules:
